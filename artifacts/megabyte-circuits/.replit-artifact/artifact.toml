kind = "web"
previewPath = "/"
title = "MegaByte's Circuit Systems"
version = "1.0.0"
id = "artifacts/megabyte-circuits"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19294

[services.development]
run = "pnpm --filter @workspace/megabyte-circuits run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/megabyte-circuits", "run", "build" ]
publicDir = "artifacts/megabyte-circuits/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19294"
BASE_PATH = "/"
